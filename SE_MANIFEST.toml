# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-2"

# === Repository Identity ===

[meta]
name = { repo = "se-mapping-education", kind = "semantic", version = "main" }
org = "structural-explainability"
status = "active"
version = "0.1.0"

[repo]
class = "mapping"
summary = "Education-domain conformance examples for Structural Explainability mapping rules."

# === Dependency Declarations ===

[depends]
required = [
  { repo = "se-constitution", kind = "semantic", version = "main" },
  { repo = { repo = "se-kernel", kind = "semantic", version = "main" }, kind = "semantic", version = "main" },
  { repo = { repo = "se-mapspec", kind = "semantic", version = "main" }, kind = "semantic", version = "main" },
]
optional = [
  { repo = { repo = "se-mapping-education-math", kind = "semantic", version = "main" }, kind = "semantic", version = "main" },
  { repo = { repo = "se-mapping-education-math-g8", kind = "semantic", version = "main" }, kind = "semantic", version = "main" },
]

# === Provided Artifacts ===

[provides]
artifacts = [
  "education-domain-boundary",
  "education-mapping-scope",
  "education-example-index",
]

# === Scope ===

[scope]
includes = [
  "definition of education-domain mapping boundary",
  "definition of education mapping scope",
  "index of bounded education conformance examples",
]

excludes = [
  "source registries",
  "dashboards",
  "analytics applications",
  "policy interpretation",
  "claims about educational quality",
]

[validation]
entrypoint = "none"

# === Behavior / governance ===

[naming]
pattern = "se-mapping-{standard}"

[governance]
authority = "structural-explainability"

# === External references ===

[citation]
cff = "CITATION.cff"

[traceability]
identifier_map = "none"
